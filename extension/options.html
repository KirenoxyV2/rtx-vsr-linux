<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RTX VSR options</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 520px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; font: inherit; }
  textarea { height: 96px; font-family: ui-monospace, monospace; }
  small { color: #777; font-weight: 400; }
  button { margin-top: 20px; padding: 8px 18px; font: inherit; }
  #status { margin-left: 12px; }
  p { color: #777; }
</style>
</head>
<body>
  <h2>RTX VSR</h2>
  <p>Resolution, quality and the on-video indicator are set in the RTX VSR app.</p>

  <label>Enabled sites <small>(one per line; subdomains included)</small>
    <textarea id="sites" spellcheck="false"></textarea>
  </label>

  <label>App address <small>(change it only if the app listens on another port)</small>
    <input id="proxy" type="url">
  </label>

  <button id="save">Save</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
