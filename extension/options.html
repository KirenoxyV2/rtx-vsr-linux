<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RTX VSR — options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 520px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input, select, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; font: inherit; }
  textarea { height: 96px; font-family: ui-monospace, monospace; }
  small { color: #666; font-weight: 400; }
  button { margin-top: 20px; padding: 8px 18px; font: inherit; }
  #status { margin-left: 12px; }
  #proxyState { margin-top: 20px; padding: 10px 12px; border-radius: 6px; background: #f2f2f2; }
</style>
</head>
<body>
  <h2>RTX VSR Local Upscaler</h2>

  <label>Quality
    <select id="mode">
      <option value="1">LOW — fastest</option>
      <option value="2">MEDIUM</option>
      <option value="3">HIGH</option>
      <option value="4">ULTRA — slowest</option>
    </select>
  </label>

  <label>Upscale factor <small>(capped at the screen height and the proxy's --max-out)</small>
    <input id="scale" type="number" min="1.1" max="4" step="0.1">
  </label>

  <label>Enabled sites <small>(one per line; subdomains included)</small>
    <textarea id="sites" spellcheck="false"></textarea>
  </label>

  <label>Proxy address
    <input id="proxy" type="url">
  </label>

  <button id="save">Save</button><span id="status"></span>
  <div id="proxyState">Checking proxy…</div>

  <script src="options.js"></script>
</body>
</html>
