<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RTX VSR</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 290px; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .row > span { font-weight: 600; }
  #site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=checkbox] { width: 18px; height: 18px; flex: none; accent-color: #76b900; }
  small { display: block; color: #666; }
  .box { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: #f2f2f2; }
  .box.ok { border-left: 3px solid #76b900; }
  .box.bad { border-left: 3px solid #d9822b; }
  a { display: inline-block; margin-top: 12px; color: inherit; }
  @media (prefers-color-scheme: dark) {
    small { color: #aaa; }
    .box { background: #333; }
  }
</style>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt="">RTX VSR</h1>

  <label class="row">
    <span id="site">…</span>
    <input id="enabled" type="checkbox">
  </label>
  <small id="siteNote"></small>

  <div class="box" id="pageState" hidden></div>
  <div class="box" id="appState">Looking for the RTX VSR app…</div>
  <small>Resolution, quality and the on-video indicator are set in the app.</small>

  <a href="#" id="options">Sites and options…</a>

  <script src="popup.js"></script>
</body>
</html>
