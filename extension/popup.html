<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RTX VSR</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 280px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .row > span { font-weight: 600; }
  #site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select, input[type=number] { width: 150px; box-sizing: border-box; padding: 4px; font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; flex: none; accent-color: #76b900; }
  small { display: block; color: #666; }
  .box { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: #f2f2f2; }
  a { display: inline-block; margin-top: 12px; color: inherit; }
  @media (prefers-color-scheme: dark) {
    small { color: #aaa; }
    .box { background: #333; }
  }
</style>
</head>
<body>
  <h1>RTX VSR Local Upscaler</h1>

  <label class="row">
    <span id="site">…</span>
    <input id="enabled" type="checkbox">
  </label>
  <small id="siteNote"></small>

  <label class="row"><span>Quality</span>
    <select id="mode">
      <option value="1">LOW — fastest</option>
      <option value="2">MEDIUM</option>
      <option value="3">HIGH</option>
      <option value="4">ULTRA — slowest</option>
    </select>
  </label>

  <label class="row"><span>Upscale factor</span>
    <input id="scale" type="number" min="1.1" max="4" step="0.1">
  </label>

  <div class="box" id="pageState" hidden></div>
  <div class="box" id="proxyState">Checking proxy…</div>

  <a href="#" id="options">All options…</a>

  <script src="popup.js"></script>
</body>
</html>
